name: Bug report
description: Report a bug in Mirah
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Mirah version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: windows_version
    attributes:
      label: Windows version
      options:
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
