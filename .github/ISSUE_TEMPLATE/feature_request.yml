name: Feature request
description: Suggest an idea for Mirah
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: Feature summary
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this feature is needed
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Any alternatives considered
